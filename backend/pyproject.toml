[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fact-o-check-backend"
version = "0.1.0"
description = "Evidence-grounded fact knowledge layer API"
requires-python = ">=3.11"
dependencies = [
  "beanie>=1.29,<2.0",
  "fastapi>=0.115,<1.0",
  "motor>=3.6,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "pymupdf>=1.25,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mongomock-motor>=0.0.36,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
